<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InoSys — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">

    <div class="card shadow-sm" style="max-width: 400px; width: 100%;">
      <div class="card-body p-4 p-md-5">

        <!-- Marca do sistema (pode ser substituída por um logotipo em produção) -->
        <div class="text-center mb-4">
          <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle bg-primary text-white" style="width: 56px; height: 56px;">
            <i class="bi bi-box-seam fs-3"></i>
          </div>
          <h1 class="h4 mb-1 fw-bold">InoSys</h1>
          <p class="text-muted mb-0">Gestão de Estoque e Fretes</p>
        </div>

        <!-- Bloco de mensagens de erro.
             Django: {% if form.errors %}<div class="alert alert-danger">...{% endif %} -->
        <div id="alertaLogin" class="alert alert-danger d-none" role="alert">
          Usuário ou senha inválidos.
        </div>

        <!-- Formulário de autenticação.
             Django: form de login (AuthenticationForm); POST para a view de login. -->
        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuário</label>
            <!-- Django: {{ form.username }} -->
            <input type="text" class="form-control" id="usuario" name="usuario" autocomplete="username" placeholder="Seu usuário" required>
          </div>

          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <!-- Django: {{ form.password }} -->
            <input type="password" class="form-control" id="senha" name="senha" autocomplete="current-password" placeholder="Sua senha" required>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
            </button>
          </div>

          <!-- Não há fluxo de recuperação de senha por e-mail.
               O link abre um modal informativo. -->
          <div class="text-center">
            <button type="button" class="btn btn-link btn-sm" data-bs-toggle="modal" data-bs-target="#modalAjuda">
              <i class="bi bi-question-circle me-1"></i> Não consegue acessar a sua conta?
            </button>
          </div>
        </form>

        <!-- Sem autocadastro: contas criadas apenas pelo Administrador -->
        <p class="text-muted small text-center mt-4 mb-0">
          Contas são criadas somente pelo administrador do sistema.
        </p>

      </div>
    </div>
  </main>

  <!-- ============================================================
       MODAL: Ajuda com acesso à conta
       Django: em produção, o texto pode ser um bloco traduzível e
       incluir um link de contato com o setor de TI.
       ============================================================ -->
  <div class="modal fade" id="modalAjuda" tabindex="-1" aria-labelledby="tituloModalAjuda" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModalAjuda">
            <i class="bi bi-question-circle me-1"></i>Não consegue acessar a sua conta?
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">
            O acesso a esta plataforma é gerenciado internamente. Caso tenha perdido sua senha,
            solicite a redefinição ao setor de TI ou ao seu gestor.
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Mockup: a submissão redireciona para a seleção de dashboards.
    // Django: POST para a view de login; redireciona conforme o perfil do usuário.
    document.getElementById('formLogin').addEventListener('submit', function (e) {
      e.preventDefault();
      var usuario = document.getElementById('usuario').value.trim();
      var senha = document.getElementById('senha').value.trim();
      if (!usuario || !senha) {
        document.getElementById('alertaLogin').classList.remove('d-none');
        return;
      }
      window.location.href = 'selecao.html';
    });
  </script>
</body>
</html>
